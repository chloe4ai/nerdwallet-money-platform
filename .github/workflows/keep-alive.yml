name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping frontend
        run: curl -sS -m 90 -o /dev/null -w "frontend -> %{http_code}\n" https://nerdwallet-money.onrender.com/ || true
      - name: Ping backend
        run: curl -sS -m 90 -o /dev/null -w "backend  -> %{http_code}\n" https://nerdwallet-backend.onrender.com/api/health || true
